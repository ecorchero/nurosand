<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nurosand — Live HR + IMU</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222c;
      --text: #e8eef4;
      --muted: #8b9aab;
      --accent: #ff4d6d;
      --imu: #4db8ff;
      --x: #ff6b6b;
      --y: #51cf66;
      --z: #4dabf7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "SF Pro Display", "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, #2a1520 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #132033 0%, transparent 50%),
        var(--bg);
      color: var(--text);
    }
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 3rem;
    }
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .status {
      font-size: 0.85rem;
      color: var(--muted);
    }
    .status.live { color: #5dde8c; }
    .metrics {
      display: flex;
      flex-wrap: wrap;
      gap: 1.75rem 2rem;
      margin-bottom: 1.25rem;
    }
    .metric {
      display: flex;
      align-items: flex-end;
      gap: 0.5rem;
    }
    .metric .value {
      font-size: clamp(2.2rem, 8vw, 4.5rem);
      font-weight: 650;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .metric.hr .value { color: var(--accent); }
    .metric.imu .value { color: var(--imu); font-size: clamp(1.6rem, 6vw, 2.8rem); }
    .metric.axis .value { font-size: clamp(1.2rem, 4vw, 1.8rem); }
    .metric.axis.x .value { color: var(--x); }
    .metric.axis.y .value { color: var(--y); }
    .metric.axis.z .value { color: var(--z); }
    .metric .unit {
      margin-bottom: 0.35rem;
      color: var(--muted);
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .chart-shell {
      background: color-mix(in srgb, var(--panel) 88%, black);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 1rem 1rem 0.5rem;
      height: min(32vh, 280px);
      margin-bottom: 1rem;
    }
    .chart-label {
      font-size: 0.8rem;
      color: var(--muted);
      margin: 0 0 0.4rem 0.2rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Nurosand</h1>
      <div id="status" class="status">Connecting…</div>
    </header>
    <div class="metrics">
      <div class="metric hr">
        <div id="bpm" class="value">—</div>
        <div class="unit">BPM</div>
      </div>
      <div class="metric imu">
        <div id="amag" class="value">—</div>
        <div class="unit">|a|</div>
      </div>
      <div class="metric axis x">
        <div id="ax" class="value">—</div>
        <div class="unit">ax</div>
      </div>
      <div class="metric axis y">
        <div id="ay" class="value">—</div>
        <div class="unit">ay</div>
      </div>
      <div class="metric axis z">
        <div id="az" class="value">—</div>
        <div class="unit">az</div>
      </div>
    </div>
    <div class="chart-label">Heart rate</div>
    <div class="chart-shell">
      <canvas id="hrChart"></canvas>
    </div>
    <div class="chart-label">Acceleration axes (user, g)</div>
    <div class="chart-shell">
      <canvas id="accelChart"></canvas>
    </div>
    <div class="chart-label">Gyroscope axes (rad/s)</div>
    <div class="chart-shell">
      <canvas id="gyroChart"></canvas>
    </div>
    <div class="chart-label">Orientation trail (roll vs pitch — holds position when you stop)</div>
    <div class="chart-shell">
      <canvas id="trailChart"></canvas>
    </div>
  </main>
  <script>
    const MAX_HR = 180;
    const MAX_IMU = 200;
    const MAX_TRAIL = 100;
    const SMOOTHING_SAMPLES = 5;
    const RENDER_INTERVAL_MS = 200;
    const imuBuffer = [];
    let lastIMURender = 0;
    const bpmEl = document.getElementById("bpm");
    const amagEl = document.getElementById("amag");
    const axEl = document.getElementById("ax");
    const ayEl = document.getElementById("ay");
    const azEl = document.getElementById("az");
    const statusEl = document.getElementById("status");

    const axisOpts = {
      x: {
        ticks: { color: "#8b9aab", maxTicksLimit: 6 },
        grid: { color: "rgba(255,255,255,0.06)" },
      },
      y: {
        ticks: { color: "#8b9aab" },
        grid: { color: "rgba(255,255,255,0.06)" },
      },
    };

    const legendOpts = {
      display: true,
      labels: { color: "#8b9aab", boxWidth: 12 },
    };

    function xyzDatasets(prefix) {
      return [
        { label: prefix + "x", data: [], borderColor: "#ff6b6b", borderWidth: 1.75, pointRadius: 0, tension: 0.15, fill: false },
        { label: prefix + "y", data: [], borderColor: "#51cf66", borderWidth: 1.75, pointRadius: 0, tension: 0.15, fill: false },
        { label: prefix + "z", data: [], borderColor: "#4dabf7", borderWidth: 1.75, pointRadius: 0, tension: 0.15, fill: false },
      ];
    }

    const hrChart = new Chart(document.getElementById("hrChart"), {
      type: "line",
      data: {
        labels: [],
        datasets: [{
          label: "Heart rate",
          data: [],
          borderColor: "#ff4d6d",
          backgroundColor: "rgba(255, 77, 109, 0.12)",
          borderWidth: 2,
          pointRadius: 0,
          tension: 0.25,
          fill: true,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        scales: {
          x: axisOpts.x,
          y: { ...axisOpts.y, suggestedMin: 40, suggestedMax: 160 },
        },
        plugins: { legend: { display: false } },
      },
    });

    const accelChart = new Chart(document.getElementById("accelChart"), {
      type: "line",
      data: { labels: [], datasets: xyzDatasets("a") },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        scales: {
          x: axisOpts.x,
          y: { ...axisOpts.y, suggestedMin: -2, suggestedMax: 2 },
        },
        plugins: { legend: legendOpts },
      },
    });

    const gyroChart = new Chart(document.getElementById("gyroChart"), {
      type: "line",
      data: { labels: [], datasets: xyzDatasets("g") },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        scales: {
          x: axisOpts.x,
          y: { ...axisOpts.y, suggestedMin: -3, suggestedMax: 3 },
        },
        plugins: { legend: legendOpts },
      },
    });

    const trailChart = new Chart(document.getElementById("trailChart"), {
      type: "scatter",
      data: {
        datasets: [
          {
            label: "Trail",
            data: [],
            borderColor: "rgba(77, 184, 255, 0.65)",
            backgroundColor: "rgba(77, 184, 255, 0.25)",
            borderWidth: 2,
            pointRadius: 1.5,
            showLine: true,
            tension: 0.2,
          },
          {
            label: "Current",
            data: [],
            borderColor: "#ffffff",
            backgroundColor: "#ff4d6d",
            borderWidth: 2,
            pointRadius: 7,
            pointHoverRadius: 7,
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        scales: {
          x: {
            type: "linear",
            title: { display: true, text: "roll (°)", color: "#8b9aab" },
            suggestedMin: -180,
            suggestedMax: 180,
            ticks: { color: "#8b9aab" },
            grid: { color: "rgba(255,255,255,0.06)" },
          },
          y: {
            type: "linear",
            title: { display: true, text: "pitch (°)", color: "#8b9aab" },
            suggestedMin: -90,
            suggestedMax: 90,
            ticks: { color: "#8b9aab" },
            grid: { color: "rgba(255,255,255,0.06)" },
          },
        },
        plugins: { legend: legendOpts },
      },
    });

    function formatTime(t) {
      const d = new Date(t * 1000);
      return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    }

    function fmtAxis(v) {
      if (!Number.isFinite(v)) return "—";
      const sign = v >= 0 ? "+" : "";
      return sign + v.toFixed(2);
    }

    function pushBounded(chart, label, valuesByDataset, max) {
      chart.data.labels.push(label);
      valuesByDataset.forEach((value, i) => {
        chart.data.datasets[i].data.push(value);
      });
      while (chart.data.labels.length > max) {
        chart.data.labels.shift();
        chart.data.datasets.forEach((ds) => ds.data.shift());
      }
      chart.update("none");
    }

    function averageIMU(samples) {
      const keys = ["ax", "ay", "az", "gx", "gy", "gz", "roll", "pitch", "yaw"];
      const result = {};
      keys.forEach((key) => {
        result[key] = samples.reduce((sum, sample) => sum + Number(sample[key]), 0) / samples.length;
      });
      result.amag = Math.hypot(result.ax, result.ay, result.az);
      result.gmag = Math.hypot(result.gx, result.gy, result.gz);
      result.t = Number(samples[samples.length - 1].t) || Date.now() / 1000;
      return result;
    }

    const toDegrees = (rad) => (rad * 180) / Math.PI;

    function pushTrail(rollRad, pitchRad) {
      const point = { x: toDegrees(rollRad), y: toDegrees(pitchRad) };
      trailChart.data.datasets[0].data.push(point);
      while (trailChart.data.datasets[0].data.length > MAX_TRAIL) {
        trailChart.data.datasets[0].data.shift();
      }
      trailChart.data.datasets[1].data = [point];
      trailChart.update("none");
    }

    function pushSample(sample) {
      const t = Number(sample.t) || Date.now() / 1000;
      const type = sample.type || (sample.bpm != null ? "hr" : "imu");

      if (type === "hr") {
        const bpm = Number(sample.bpm);
        if (!Number.isFinite(bpm)) return;
        bpmEl.textContent = Math.round(bpm).toString();
        pushBounded(hrChart, formatTime(t), [bpm], MAX_HR);
        return;
      }

      if (type === "imu") {
        const rawValues = ["ax", "ay", "az", "gx", "gy", "gz"].map((key) => Number(sample[key]));
        if (!rawValues.every(Number.isFinite)) return;
        ["roll", "pitch", "yaw"].forEach((key) => {
          if (!Number.isFinite(Number(sample[key]))) sample[key] = 0;
        });

        imuBuffer.push(sample);
        while (imuBuffer.length > SMOOTHING_SAMPLES) imuBuffer.shift();

        const now = performance.now();
        if (now - lastIMURender < RENDER_INTERVAL_MS) return;
        lastIMURender = now;

        const smoothed = averageIMU(imuBuffer);
        const { ax, ay, az, gx, gy, gz, amag, roll, pitch } = smoothed;

        amagEl.textContent = amag.toFixed(2);
        axEl.textContent = fmtAxis(ax);
        ayEl.textContent = fmtAxis(ay);
        azEl.textContent = fmtAxis(az);

        const label = formatTime(smoothed.t);
        pushBounded(accelChart, label, [ax, ay, az], MAX_IMU);
        pushBounded(gyroChart, label, [gx, gy, gz], MAX_IMU);
        pushTrail(roll, pitch);
      }
    }

    function connect() {
      const source = new EventSource("/events");
      source.onopen = () => {
        statusEl.textContent = "Live";
        statusEl.classList.add("live");
      };
      source.onerror = () => {
        statusEl.textContent = "Reconnecting…";
        statusEl.classList.remove("live");
      };
      source.onmessage = (event) => {
        try {
          pushSample(JSON.parse(event.data));
        } catch (_) {}
      };
    }

    connect();
  </script>
</body>
</html>
