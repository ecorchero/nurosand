<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-label="Balance demo">
  <rect width="320" height="220" fill="#eef6f4"/>
  <text x="160" y="28" text-anchor="middle" fill="#1f6b63" font-family="Georgia, serif" font-size="14">Balance</text>
  <g transform="translate(160 150)">
    <ellipse cx="0" cy="48" rx="46" ry="8" fill="#c5ddd8"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-8;8;-8" dur="2.4s" repeatCount="indefinite"/>
      <circle cx="0" cy="-78" r="12" fill="#1c1c1a"/>
      <line x1="0" y1="-66" x2="0" y2="-20" stroke="#1c1c1a" stroke-width="6" stroke-linecap="round"/>
      <line x1="0" y1="-54" x2="-28" y2="-34" stroke="#1c1c1a" stroke-width="5" stroke-linecap="round"/>
      <line x1="0" y1="-54" x2="30" y2="-38" stroke="#1c1c1a" stroke-width="5" stroke-linecap="round"/>
      <line x1="0" y1="-20" x2="-4" y2="40" stroke="#1c1c1a" stroke-width="6" stroke-linecap="round"/>
      <line x1="0" y1="-20" x2="18" y2="8" stroke="#1c1c1a" stroke-width="6" stroke-linecap="round"/>
      <circle cx="18" cy="8" r="4" fill="#1f6b63"/>
    </g>
  </g>
  <text x="160" y="208" text-anchor="middle" fill="#5f5e5a" font-family="Georgia, serif" font-size="12">Hold steady · eyes forward</text>
</svg>
