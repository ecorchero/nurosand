<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-label="Memory demo">
  <rect width="320" height="220" fill="#eef6f4"/>
  <text x="160" y="28" text-anchor="middle" fill="#1f6b63" font-family="Georgia, serif" font-size="14">Memory</text>
  <g font-family="Georgia, serif" font-size="22" fill="#1c1c1a" text-anchor="middle">
    <text x="90" y="100">A</text>
    <text x="160" y="100">7</text>
    <text x="230" y="100">K</text>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.35;0.45;0.85;1" dur="3.5s" repeatCount="indefinite"/>
      <text x="90" y="150" fill="#1f6b63">A</text>
      <text x="160" y="150" fill="#1f6b63">7</text>
      <text x="230" y="150" fill="#1f6b63">K</text>
    </g>
  </g>
  <text x="160" y="208" text-anchor="middle" fill="#5f5e5a" font-family="Georgia, serif" font-size="12">See · hold · recall</text>
</svg>
