<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-label="Mobility demo">
  <rect width="320" height="220" fill="#eef6f4"/>
  <text x="160" y="28" text-anchor="middle" fill="#1f6b63" font-family="Georgia, serif" font-size="14">Mobility</text>
  <line x1="40" y1="170" x2="280" y2="170" stroke="#c5ddd8" stroke-width="4"/>
  <g>
    <animateTransform attributeName="transform" type="translate" values="40 0;220 0;40 0" dur="3.2s" repeatCount="indefinite"/>
    <g transform="translate(0 90)">
      <circle cx="20" cy="12" r="10" fill="#1c1c1a"/>
      <line x1="20" y1="22" x2="20" y2="55" stroke="#1c1c1a" stroke-width="5" stroke-linecap="round"/>
      <line x1="20" y1="35" x2="2" y2="48" stroke="#1c1c1a" stroke-width="4" stroke-linecap="round"/>
      <line x1="20" y1="35" x2="38" y2="48" stroke="#1c1c1a" stroke-width="4" stroke-linecap="round"/>
      <line x1="20" y1="55" x2="6" y2="80" stroke="#1c1c1a" stroke-width="5" stroke-linecap="round"/>
      <line x1="20" y1="55" x2="36" y2="72" stroke="#1c1c1a" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>
  <circle cx="100" cy="168" r="8" fill="#1f6b63" opacity="0.35"/>
  <circle cx="160" cy="168" r="8" fill="#1f6b63" opacity="0.35"/>
  <circle cx="220" cy="168" r="8" fill="#1f6b63" opacity="0.35"/>
  <text x="160" y="208" text-anchor="middle" fill="#5f5e5a" font-family="Georgia, serif" font-size="12">Step over · controlled gait</text>
</svg>
