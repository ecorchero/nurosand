<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-label="Knee to elbow crunch demo">
  <rect width="360" height="240" fill="#f7f7f5"/>
  <text x="180" y="28" text-anchor="middle" fill="#1f6b63" font-family="Georgia, serif" font-size="15">Knee to Elbow</text>
  <g transform="translate(180 55)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0;-28;0;28;0" dur="2.4s" repeatCount="indefinite" additive="sum"/>
      <circle cx="0" cy="14" r="12" fill="#1c1c1a"/>
      <line x1="0" y1="26" x2="0" y2="78" stroke="#1c1c1a" stroke-width="7" stroke-linecap="round"/>
      <!-- arms -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="25;-35;25;55;25" dur="2.4s" repeatCount="indefinite"/>
        <line x1="0" y1="42" x2="-40" y2="58" stroke="#1c1c1a" stroke-width="5" stroke-linecap="round"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-25;35;-25;-55;-25" dur="2.4s" repeatCount="indefinite"/>
        <line x1="0" y1="42" x2="40" y2="58" stroke="#1c1c1a" stroke-width="5" stroke-linecap="round"/>
      </g>
      <!-- legs -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="10;45;10;-20;10" dur="2.4s" repeatCount="indefinite"/>
        <line x1="0" y1="78" x2="-18" y2="130" stroke="#1c1c1a" stroke-width="7" stroke-linecap="round"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-10;-20;-10;45;-10" dur="2.4s" repeatCount="indefinite"/>
        <line x1="0" y1="78" x2="18" y2="130" stroke="#1c1c1a" stroke-width="7" stroke-linecap="round"/>
      </g>
    </g>
  </g>
  <text x="180" y="228" text-anchor="middle" fill="#5f5e5a" font-family="Georgia, serif" font-size="12">Opposite knee meets elbow · switch sides</text>
</svg>
